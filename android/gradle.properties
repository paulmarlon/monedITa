org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# URLs base de tu API (deben terminar en "/")
# Emulador -> 10.0.2.2 apunta al localhost de tu PC.
# Si usas `php artisan serve`, cambia a http://10.0.2.2:8000/api/
# Con celular físico usa la IP LAN de tu PC, ej: http://192.168.1.50:8000/api/
API_BASE_URL_DEBUG=http://127.0.0.1:8080/api/
API_BASE_URL_RELEASE=https://tu-dominio/api/

# Datos de juegos de prueba en memoria (solo build debug; el login sigue usando el backend real).
# Escenarios: NORMAL, NO_CYCLE, NO_CREDITS, NO_TEAM, FLAKY_SUBMIT
USE_FAKE_BACKEND=false
FAKE_SCENARIO=NORMAL
